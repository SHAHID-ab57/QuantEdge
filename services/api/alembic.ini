# Alembic configuration for the API service.
#
# The connection URL is intentionally NOT set here: alembic/env.py reads it
# from the application settings (DATABASE_URL / DB_URL via pydantic-settings)
# so this file never duplicates or drifts from app configuration.
#
# Run commands through the Makefile (see `make help`-style targets below) or
# directly:
#
#   uv run alembic upgrade head
#   uv run alembic revision --autogenerate -m "description"

[alembic]
script_location = alembic
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# The URL below is a placeholder for offline `--sql` introspection only;
# env.py overrides it with the application's database_url at runtime.
sqlalchemy.url = postgresql+asyncpg://user:pass@localhost:5432/eth_platform

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S